  studio_alert_telegram_chat_id:
    file: ${STUDIO_ALERT_TELEGRAM_CHAT_ID_FILE:-./optional-empty-secret}
  studio_job_web_push_vapid_private_key:
    file: ${STUDIO_JOB_WEB_PUSH_VAPID_PRIVATE_KEY_FILE:-./optional-empty-secret}
  studio_job_smtp_password:
    file: ${STUDIO_JOB_SMTP_PASSWORD_FILE:-./optional-empty-secret}
  studio_job_telegram_bot_token:
