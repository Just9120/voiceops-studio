    secrets:
      - studio_credential_master_key
      - source: studio_worker_postgres_password
        target: studio_postgres_password
      - studio_source_s3_access_key_id
      - studio_source_s3_secret_access_key
      - studio_audio_reference_s3_access_key_id
      - studio_audio_reference_s3_secret_access_key
      - studio_google_oauth_client_secret
      - studio_google_maintenance_oauth_client_secret
      - studio_alert_telegram_bot_token
      - studio_alert_telegram_chat_id
      - studio_job_web_push_vapid_private_key
      - studio_job_smtp_password
      - studio_job_telegram_bot_token
      - studio_job_telegram_chat_id
    volumes:
      - studio-audio-delivery:/run/studio-audio-delivery
    tmpfs:
      - /run/studio-runtime-secrets:mode=0711,uid=0,gid=0
      - /tmp:rw,nosuid,nodev,noexec,mode=1770,uid=10001,gid=10001,size=${STUDIO_WORKER_TMPFS_SIZE:-3g}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-m", "studio_api.container_entrypoint", "--drop-only", "python", "-m", "studio_api.worker_health", "--mode", "readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 86460s
  studio-migrator:
    profiles: [tools]
    image: elevenlabs-studio-api:local
    user: "0:0"
    networks: [studio-api-db]
    environment:
      STUDIO_DATABASE_SCHEME: postgresql+psycopg
      STUDIO_DATABASE_HOST: postgres
      STUDIO_DATABASE_PORT: "5432"
      STUDIO_DATABASE_NAME: studio
      STUDIO_DATABASE_USER: studio_migrator
      STUDIO_CONTAINER_SECRET_BOOTSTRAP: required
      STUDIO_POSTGRES_PASSWORD_FILE: /run/studio-runtime-secrets/studio_postgres_password
    secrets:
      - source: studio_migrator_postgres_password
        target: studio_postgres_password
    tmpfs:
      - /run/studio-runtime-secrets:mode=0711,uid=0,gid=0
    depends_on:
      postgres: { condition: service_healthy }
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD_FILE: /run/secrets/studio_postgres_password
    secrets: [studio_postgres_password]
    volumes: [studio-postgres-data:/var/lib/postgresql/data]
    networks:
      - studio-api-db
      - studio-worker-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 30s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [studio-api-cache]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
secrets:
  studio_postgres_password:
    file: ${STUDIO_POSTGRES_PASSWORD_FILE:?secret file required}
  studio_worker_postgres_password:
    file: ${STUDIO_WORKER_POSTGRES_PASSWORD_FILE:?worker database secret file required}
  studio_api_postgres_password:
    file: ${STUDIO_API_POSTGRES_PASSWORD_FILE:?API database secret file required}
