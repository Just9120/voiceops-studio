volumes:
  studio-postgres-data:
  studio-audio-delivery:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=2147483648,uid=10001,gid=10001,mode=0700,nosuid,nodev,noexec"
networks:
  studio-web-ingress:
