name: elevenlabs-studio-platform
services:
  studio-web:
    build:
      context: ../../apps/studio
      args:
        STUDIO_RELEASE_VERSION: ${STUDIO_RELEASE_VERSION:-unknown}
        STUDIO_COMMIT_SHA: ${STUDIO_RELEASE_SHA:-unknown}
        STUDIO_COMPONENT: web
    image: elevenlabs-studio-web:local
    restart: unless-stopped
    ports: ["127.0.0.1:8181:8080"]
    # Docker does not publish host ports for an internal-only container.
    # Keep this non-internal bridge exclusive to web; the binding stays loopback.
    networks: [studio-web-api, studio-web-ingress]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 30s
      timeout: 3s
      retries: 3
  studio-api:
    build:
      context: ../../apps/studio-api
      args:
        STUDIO_RELEASE_VERSION: ${STUDIO_RELEASE_VERSION:-unknown}
        STUDIO_COMMIT_SHA: ${STUDIO_RELEASE_SHA:-unknown}
        STUDIO_COMPONENT: api
    image: elevenlabs-studio-api:local
    # The entrypoint copies host-owned 0600 secrets, then drops to UID/GID 10001.
    user: "0:0"
    restart: unless-stopped
    ports: ["127.0.0.1:8182:8000"]
    networks:
      - studio-web-api
      - studio-api-db
      - studio-api-cache
      - studio-api-egress
    environment:
      STUDIO_DATABASE_SCHEME: postgresql+psycopg
      STUDIO_DATABASE_HOST: postgres
      STUDIO_DATABASE_PORT: "5432"
      STUDIO_DATABASE_NAME: studio
      STUDIO_DATABASE_USER: studio_api
      STUDIO_CONTAINER_SECRET_BOOTSTRAP: required
      STUDIO_POSTGRES_PASSWORD_FILE: /run/studio-runtime-secrets/studio_postgres_password
      STUDIO_REDIS_URL: redis://redis:6379/0
      STUDIO_APP_ORIGIN: ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
      STUDIO_TRUSTED_PROXY_IP: ${STUDIO_TRUSTED_PROXY_IP:-127.0.0.1}
      STUDIO_SESSION_LAST_SEEN_WRITE_INTERVAL_SECONDS: ${STUDIO_SESSION_LAST_SEEN_WRITE_INTERVAL_SECONDS:-300}
      STUDIO_RECENT_AUTH_SECONDS: ${STUDIO_RECENT_AUTH_SECONDS:-600}
      STUDIO_AUTH_CLEANUP_INTERVAL_SECONDS: ${STUDIO_AUTH_CLEANUP_INTERVAL_SECONDS:-3600}
      STUDIO_AUTH_CLEANUP_BATCH_SIZE: ${STUDIO_AUTH_CLEANUP_BATCH_SIZE:-500}
      STUDIO_CREDENTIAL_MASTER_KEY_FILE: /run/studio-runtime-secrets/studio_credential_master_key
      STUDIO_SOURCE_S3_ENDPOINT_URL: ${STUDIO_SOURCE_S3_ENDPOINT_URL:?STUDIO_SOURCE_S3_ENDPOINT_URL is required}
      STUDIO_SOURCE_S3_REGION: ${STUDIO_SOURCE_S3_REGION:?STUDIO_SOURCE_S3_REGION is required}
      STUDIO_SOURCE_S3_BUCKET: ${STUDIO_SOURCE_S3_BUCKET:?STUDIO_SOURCE_S3_BUCKET is required}
      STUDIO_SOURCE_S3_ACCESS_KEY_ID_FILE: /run/studio-runtime-secrets/studio_source_s3_access_key_id
      STUDIO_SOURCE_S3_SECRET_ACCESS_KEY_FILE: /run/studio-runtime-secrets/studio_source_s3_secret_access_key
      STUDIO_SOURCE_S3_LIFECYCLE_RULE_ID: ${STUDIO_SOURCE_S3_LIFECYCLE_RULE_ID:?transcription reference lifecycle rule id is required}
      STUDIO_AUDIO_REFERENCE_S3_ENDPOINT_URL: ${STUDIO_AUDIO_REFERENCE_S3_ENDPOINT_URL:?audio reference S3 endpoint URL is required}
      STUDIO_AUDIO_REFERENCE_S3_REGION: ${STUDIO_AUDIO_REFERENCE_S3_REGION:?audio reference S3 region is required}
      STUDIO_AUDIO_REFERENCE_S3_BUCKET: ${STUDIO_AUDIO_REFERENCE_S3_BUCKET:?audio reference S3 bucket is required}
      STUDIO_AUDIO_REFERENCE_S3_ACCESS_KEY_ID_FILE: /run/studio-runtime-secrets/studio_audio_reference_s3_access_key_id
      STUDIO_AUDIO_REFERENCE_S3_SECRET_ACCESS_KEY_FILE: /run/studio-runtime-secrets/studio_audio_reference_s3_secret_access_key
      STUDIO_AUDIO_REFERENCE_S3_LIFECYCLE_RULE_ID: ${STUDIO_AUDIO_REFERENCE_S3_LIFECYCLE_RULE_ID:?audio reference lifecycle rule id is required}
      STUDIO_SOURCE_UPLOAD_TTL_SECONDS: ${STUDIO_SOURCE_UPLOAD_TTL_SECONDS:?STUDIO_SOURCE_UPLOAD_TTL_SECONDS is required}
      STUDIO_SOURCE_PRESIGN_TTL_SECONDS: ${STUDIO_SOURCE_PRESIGN_TTL_SECONDS:?STUDIO_SOURCE_PRESIGN_TTL_SECONDS is required}
      STUDIO_SOURCE_MAX_UPLOAD_BYTES: ${STUDIO_SOURCE_MAX_UPLOAD_BYTES:?STUDIO_SOURCE_MAX_UPLOAD_BYTES is required}
      STUDIO_MEDIA_DURATION_WARNING_SECONDS: ${STUDIO_MEDIA_DURATION_WARNING_SECONDS:-14400}
      STUDIO_MEDIA_MAX_DURATION_SECONDS: ${STUDIO_MEDIA_MAX_DURATION_SECONDS:-43200}
      STUDIO_ELEVENLABS_BYOK_ENABLED: ${STUDIO_ELEVENLABS_BYOK_ENABLED:-true}
      STUDIO_YANDEX_BYOK_ENABLED: ${STUDIO_YANDEX_BYOK_ENABLED:-false}
      STUDIO_ELEVENLABS_ECONOMIC_MODEL: ${STUDIO_ELEVENLABS_ECONOMIC_MODEL:-scribe_v2}
      STUDIO_ELEVENLABS_STANDARD_MODEL: ${STUDIO_ELEVENLABS_STANDARD_MODEL:-scribe_v2}
      STUDIO_ELEVENLABS_PREMIUM_MODEL: ${STUDIO_ELEVENLABS_PREMIUM_MODEL:-scribe_v2}
      STUDIO_ELEVENLABS_REALTIME_MODEL: ${STUDIO_ELEVENLABS_REALTIME_MODEL:-scribe_v2_realtime}
      STUDIO_YANDEX_ECONOMIC_MODEL: ${STUDIO_YANDEX_ECONOMIC_MODEL:-deferred-general}
      STUDIO_YANDEX_STANDARD_MODEL: ${STUDIO_YANDEX_STANDARD_MODEL:-general}
      STUDIO_YANDEX_PREMIUM_MODEL: ${STUDIO_YANDEX_PREMIUM_MODEL:-general}
      STUDIO_YANDEX_REALTIME_MODEL: ${STUDIO_YANDEX_REALTIME_MODEL:-general}
      STUDIO_YANDEX_STT_API_BASE_URL: ${STUDIO_YANDEX_STT_API_BASE_URL:-https://stt.api.cloud.yandex.net}
      STUDIO_YANDEX_OPERATIONS_API_BASE_URL: ${STUDIO_YANDEX_OPERATIONS_API_BASE_URL:-https://operation.api.cloud.yandex.net}
      STUDIO_YANDEX_STT_GRPC_ENDPOINT: ${STUDIO_YANDEX_STT_GRPC_ENDPOINT:-stt.api.cloud.yandex.net:443}
      STUDIO_YANDEX_OPERATION_POLL_INTERVAL_SECONDS: ${STUDIO_YANDEX_OPERATION_POLL_INTERVAL_SECONDS:-5}
      STUDIO_YANDEX_OPERATION_TIMEOUT_SECONDS: ${STUDIO_YANDEX_OPERATION_TIMEOUT_SECONDS:-14400}
      STUDIO_STT_HEALTH_FAILURE_THRESHOLD: ${STUDIO_STT_HEALTH_FAILURE_THRESHOLD:-3}
      STUDIO_STT_HEALTH_COOLDOWN_SECONDS: ${STUDIO_STT_HEALTH_COOLDOWN_SECONDS:-300}
      STUDIO_REALTIME_WEBHOOK_ALLOWED_HOSTS: ${STUDIO_REALTIME_WEBHOOK_ALLOWED_HOSTS:-}
      STUDIO_SOURCE_MULTIPART_THRESHOLD_BYTES: ${STUDIO_SOURCE_MULTIPART_THRESHOLD_BYTES:-16777216}
      STUDIO_SOURCE_MULTIPART_PART_SIZE_BYTES: ${STUDIO_SOURCE_MULTIPART_PART_SIZE_BYTES:-8388608}
      STUDIO_STORAGE_ORPHAN_MIN_AGE_SECONDS: ${STUDIO_STORAGE_ORPHAN_MIN_AGE_SECONDS:-86400}
      STUDIO_STORAGE_RECONCILIATION_SCAN_LIMIT: ${STUDIO_STORAGE_RECONCILIATION_SCAN_LIMIT:-500}
      STUDIO_STORAGE_RECONCILIATION_PAGE_SIZE: ${STUDIO_STORAGE_RECONCILIATION_PAGE_SIZE:-100}
      STUDIO_STORAGE_RECONCILIATION_PLAN_TTL_SECONDS: ${STUDIO_STORAGE_RECONCILIATION_PLAN_TTL_SECONDS:-600}
      STUDIO_STORAGE_RECONCILIATION_APPLY_LIMIT: ${STUDIO_STORAGE_RECONCILIATION_APPLY_LIMIT:-100}
      STUDIO_AUDIO_PREPARATION_MAX_INPUT_BYTES: ${STUDIO_AUDIO_PREPARATION_MAX_INPUT_BYTES:-1073741824}
      STUDIO_AUDIO_PREPARATION_MAX_SCRATCH_BYTES: ${STUDIO_AUDIO_PREPARATION_MAX_SCRATCH_BYTES:-3221225472}
      STUDIO_REALTIME_DRAFT_MAX_COUNT: ${STUDIO_REALTIME_DRAFT_MAX_COUNT:-20}
      STUDIO_REALTIME_DRAFT_MAX_STORAGE_BYTES: ${STUDIO_REALTIME_DRAFT_MAX_STORAGE_BYTES:-33554432}
      STUDIO_AUDIO_PREPARATION_MAX_OUTPUT_BYTES: ${STUDIO_AUDIO_PREPARATION_MAX_OUTPUT_BYTES:-2147483647}
      STUDIO_AUDIO_DELIVERY_DIRECTORY: /run/studio-audio-delivery
      STUDIO_GOOGLE_OAUTH_CLIENT_ID: ${STUDIO_GOOGLE_OAUTH_CLIENT_ID:-}
      STUDIO_GOOGLE_OAUTH_CLIENT_SECRET_FILE: /run/studio-runtime-secrets/studio_google_oauth_client_secret
      STUDIO_GOOGLE_OAUTH_REDIRECT_URI: ${STUDIO_GOOGLE_OAUTH_REDIRECT_URI:-}
      STUDIO_GOOGLE_OAUTH_SCOPES: ${STUDIO_GOOGLE_OAUTH_SCOPES:-openid email https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly}
      STUDIO_GOOGLE_OAUTH_STATE_TTL_SECONDS: ${STUDIO_GOOGLE_OAUTH_STATE_TTL_SECONDS:-600}
      STUDIO_GOOGLE_MAINTENANCE_OAUTH_CLIENT_ID: ${STUDIO_GOOGLE_MAINTENANCE_OAUTH_CLIENT_ID:-}
      STUDIO_GOOGLE_MAINTENANCE_OAUTH_CLIENT_SECRET_FILE: /run/studio-runtime-secrets/studio_google_maintenance_oauth_client_secret
      STUDIO_GOOGLE_MAINTENANCE_OAUTH_REDIRECT_URI: ${STUDIO_GOOGLE_MAINTENANCE_OAUTH_REDIRECT_URI:-}
      STUDIO_GOOGLE_MAINTENANCE_OAUTH_SCOPES: ${STUDIO_GOOGLE_MAINTENANCE_OAUTH_SCOPES:-openid email https://www.googleapis.com/auth/drive.metadata.readonly https://www.googleapis.com/auth/documents}
      STUDIO_GOOGLE_PICKER_API_KEY: ${STUDIO_GOOGLE_PICKER_API_KEY:-}
      STUDIO_GOOGLE_PICKER_APP_ID: ${STUDIO_GOOGLE_PICKER_APP_ID:-}
      STUDIO_ALERT_EVALUATION_INTERVAL_SECONDS: ${STUDIO_ALERT_EVALUATION_INTERVAL_SECONDS:-60}
      STUDIO_ALERT_SIGNAL_WINDOW_SECONDS: ${STUDIO_ALERT_SIGNAL_WINDOW_SECONDS:-900}
      STUDIO_ALERT_STUCK_QUEUE_SECONDS: ${STUDIO_ALERT_STUCK_QUEUE_SECONDS:-900}
      STUDIO_BACKUP_MONITOR_OWNER_USER_ID: ${STUDIO_BACKUP_MONITOR_OWNER_USER_ID:-}
      STUDIO_ALERT_PROVIDER_FAILURE_THRESHOLD: ${STUDIO_ALERT_PROVIDER_FAILURE_THRESHOLD:-3}
      STUDIO_ALERT_LIMIT_REMAINING_PERCENT: ${STUDIO_ALERT_LIMIT_REMAINING_PERCENT:-15}
      STUDIO_ALERT_STORAGE_LIMIT_BYTES: ${STUDIO_ALERT_STORAGE_LIMIT_BYTES:-}
      STUDIO_ALERT_INCIDENT_COOLDOWN_SECONDS: ${STUDIO_ALERT_INCIDENT_COOLDOWN_SECONDS:-1800}
      STUDIO_ALERT_DELIVERY_RETRY_SECONDS: ${STUDIO_ALERT_DELIVERY_RETRY_SECONDS:-300}
      STUDIO_ALERT_DELIVERY_MAX_ATTEMPTS: ${STUDIO_ALERT_DELIVERY_MAX_ATTEMPTS:-3}
      STUDIO_ALERT_TELEGRAM_ENABLED: ${STUDIO_ALERT_TELEGRAM_ENABLED:-false}
      STUDIO_ALERT_TELEGRAM_BOT_TOKEN_FILE: /run/studio-runtime-secrets/studio_alert_telegram_bot_token
      STUDIO_ALERT_TELEGRAM_CHAT_ID_FILE: /run/studio-runtime-secrets/studio_alert_telegram_chat_id
      STUDIO_ALERT_TELEGRAM_TIMEOUT_SECONDS: ${STUDIO_ALERT_TELEGRAM_TIMEOUT_SECONDS:-5}
      STUDIO_JOB_NOTIFICATION_RETRY_SECONDS: ${STUDIO_JOB_NOTIFICATION_RETRY_SECONDS:-60}
      STUDIO_JOB_NOTIFICATION_MAX_ATTEMPTS: ${STUDIO_JOB_NOTIFICATION_MAX_ATTEMPTS:-3}
      STUDIO_JOB_NOTIFICATION_CLAIM_SECONDS: ${STUDIO_JOB_NOTIFICATION_CLAIM_SECONDS:-60}
      STUDIO_JOB_WEB_PUSH_ENABLED: ${STUDIO_JOB_WEB_PUSH_ENABLED:-false}
      STUDIO_JOB_WEB_PUSH_VAPID_PUBLIC_KEY: ${STUDIO_JOB_WEB_PUSH_VAPID_PUBLIC_KEY:-}
      STUDIO_JOB_WEB_PUSH_VAPID_PRIVATE_KEY_FILE: /run/studio-runtime-secrets/studio_job_web_push_vapid_private_key
      STUDIO_JOB_WEB_PUSH_VAPID_SUBJECT: ${STUDIO_JOB_WEB_PUSH_VAPID_SUBJECT:-}
      STUDIO_JOB_WEB_PUSH_TIMEOUT_SECONDS: ${STUDIO_JOB_WEB_PUSH_TIMEOUT_SECONDS:-5}
      STUDIO_JOB_EMAIL_ENABLED: ${STUDIO_JOB_EMAIL_ENABLED:-false}
      STUDIO_SECURITY_EMAIL_ENABLED: ${STUDIO_SECURITY_EMAIL_ENABLED:-false}
      STUDIO_SECURITY_EMAIL_SENDER_DOMAIN: ${STUDIO_SECURITY_EMAIL_SENDER_DOMAIN:-}
      STUDIO_JOB_SMTP_HOST: ${STUDIO_JOB_SMTP_HOST:-}
      STUDIO_JOB_SMTP_PORT: ${STUDIO_JOB_SMTP_PORT:-587}
      STUDIO_JOB_SMTP_USERNAME: ${STUDIO_JOB_SMTP_USERNAME:-}
      STUDIO_JOB_SMTP_PASSWORD_FILE: /run/studio-runtime-secrets/studio_job_smtp_password
      STUDIO_JOB_SMTP_FROM_EMAIL: ${STUDIO_JOB_SMTP_FROM_EMAIL:-}
      STUDIO_JOB_SMTP_USE_SSL: ${STUDIO_JOB_SMTP_USE_SSL:-false}
      STUDIO_JOB_SMTP_STARTTLS: ${STUDIO_JOB_SMTP_STARTTLS:-true}
      STUDIO_JOB_SMTP_TIMEOUT_SECONDS: ${STUDIO_JOB_SMTP_TIMEOUT_SECONDS:-10}
      STUDIO_JOB_TELEGRAM_ENABLED: ${STUDIO_JOB_TELEGRAM_ENABLED:-false}
      STUDIO_JOB_TELEGRAM_OWNER_USER_ID: ${STUDIO_JOB_TELEGRAM_OWNER_USER_ID:-}
      STUDIO_JOB_TELEGRAM_BOT_TOKEN_FILE: /run/studio-runtime-secrets/studio_job_telegram_bot_token
      STUDIO_JOB_TELEGRAM_CHAT_ID_FILE: /run/studio-runtime-secrets/studio_job_telegram_chat_id
      STUDIO_JOB_TELEGRAM_TIMEOUT_SECONDS: ${STUDIO_JOB_TELEGRAM_TIMEOUT_SECONDS:-5}
    secrets:
      - studio_credential_master_key
      - source: studio_api_postgres_password
        target: studio_postgres_password
      - studio_source_s3_access_key_id
      - studio_source_s3_secret_access_key
      - studio_audio_reference_s3_access_key_id
      - studio_audio_reference_s3_secret_access_key
      - studio_google_oauth_client_secret
      - studio_google_maintenance_oauth_client_secret
      - studio_alert_telegram_bot_token
      - studio_alert_telegram_chat_id
      - studio_job_web_push_vapid_private_key
      - studio_job_smtp_password
      - studio_job_telegram_bot_token
      - studio_job_telegram_chat_id
    volumes:
      - studio-audio-delivery:/run/studio-audio-delivery
    tmpfs:
      - /run/studio-runtime-secrets:mode=0711,uid=0,gid=0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-m", "studio_api.container_entrypoint", "--drop-only", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/readyz',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
  studio-worker:
    build:
      context: ../../apps/studio-api
      args:
        STUDIO_RELEASE_VERSION: ${STUDIO_RELEASE_VERSION:-unknown}
        STUDIO_COMMIT_SHA: ${STUDIO_RELEASE_SHA:-unknown}
        STUDIO_COMPONENT: worker
    image: elevenlabs-studio-worker:local
    # The entrypoint copies host-owned 0600 secrets, then drops to UID/GID 10001.
    user: "0:0"
    command: ["python", "-m", "studio_api.worker"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    cpus: "${STUDIO_WORKER_CPU_LIMIT:-2.0}"
    mem_limit: ${STUDIO_WORKER_MEMORY_LIMIT:-4g}
    memswap_limit: ${STUDIO_WORKER_MEMORY_SWAP_LIMIT:-4g}
    pids_limit: ${STUDIO_WORKER_PIDS_LIMIT:-256}
    networks:
      - studio-worker-db
      - studio-worker-egress
    environment:
      STUDIO_DATABASE_SCHEME: postgresql+psycopg
      STUDIO_DATABASE_HOST: postgres
      STUDIO_DATABASE_PORT: "5432"
      STUDIO_DATABASE_NAME: studio
      STUDIO_DATABASE_USER: studio_worker
      STUDIO_CONTAINER_SECRET_BOOTSTRAP: required
      STUDIO_POSTGRES_PASSWORD_FILE: /run/studio-runtime-secrets/studio_postgres_password
      STUDIO_CREDENTIAL_MASTER_KEY_FILE: /run/studio-runtime-secrets/studio_credential_master_key
      STUDIO_SOURCE_S3_ENDPOINT_URL: ${STUDIO_SOURCE_S3_ENDPOINT_URL:?STUDIO_SOURCE_S3_ENDPOINT_URL is required}
      STUDIO_SOURCE_S3_REGION: ${STUDIO_SOURCE_S3_REGION:?STUDIO_SOURCE_S3_REGION is required}
      STUDIO_SOURCE_S3_BUCKET: ${STUDIO_SOURCE_S3_BUCKET:?STUDIO_SOURCE_S3_BUCKET is required}
      STUDIO_SOURCE_S3_ACCESS_KEY_ID_FILE: /run/studio-runtime-secrets/studio_source_s3_access_key_id
      STUDIO_SOURCE_S3_SECRET_ACCESS_KEY_FILE: /run/studio-runtime-secrets/studio_source_s3_secret_access_key
      STUDIO_SOURCE_S3_LIFECYCLE_RULE_ID: ${STUDIO_SOURCE_S3_LIFECYCLE_RULE_ID:?transcription reference lifecycle rule id is required}
      STUDIO_AUDIO_REFERENCE_S3_ENDPOINT_URL: ${STUDIO_AUDIO_REFERENCE_S3_ENDPOINT_URL:?audio reference S3 endpoint URL is required}
      STUDIO_AUDIO_REFERENCE_S3_REGION: ${STUDIO_AUDIO_REFERENCE_S3_REGION:?audio reference S3 region is required}
      STUDIO_AUDIO_REFERENCE_S3_BUCKET: ${STUDIO_AUDIO_REFERENCE_S3_BUCKET:?audio reference S3 bucket is required}
      STUDIO_AUDIO_REFERENCE_S3_ACCESS_KEY_ID_FILE: /run/studio-runtime-secrets/studio_audio_reference_s3_access_key_id
      STUDIO_AUDIO_REFERENCE_S3_SECRET_ACCESS_KEY_FILE: /run/studio-runtime-secrets/studio_audio_reference_s3_secret_access_key
      STUDIO_AUDIO_REFERENCE_S3_LIFECYCLE_RULE_ID: ${STUDIO_AUDIO_REFERENCE_S3_LIFECYCLE_RULE_ID:?audio reference lifecycle rule id is required}
      STUDIO_SOURCE_MAX_UPLOAD_BYTES: ${STUDIO_SOURCE_MAX_UPLOAD_BYTES:?STUDIO_SOURCE_MAX_UPLOAD_BYTES is required}
      STUDIO_MEDIA_DURATION_WARNING_SECONDS: ${STUDIO_MEDIA_DURATION_WARNING_SECONDS:-14400}
      STUDIO_MEDIA_MAX_DURATION_SECONDS: ${STUDIO_MEDIA_MAX_DURATION_SECONDS:-43200}
      STUDIO_ELEVENLABS_BYOK_ENABLED: ${STUDIO_ELEVENLABS_BYOK_ENABLED:-true}
      STUDIO_YANDEX_BYOK_ENABLED: ${STUDIO_YANDEX_BYOK_ENABLED:-false}
      STUDIO_ELEVENLABS_ECONOMIC_MODEL: ${STUDIO_ELEVENLABS_ECONOMIC_MODEL:-scribe_v2}
      STUDIO_ELEVENLABS_STANDARD_MODEL: ${STUDIO_ELEVENLABS_STANDARD_MODEL:-scribe_v2}
      STUDIO_ELEVENLABS_PREMIUM_MODEL: ${STUDIO_ELEVENLABS_PREMIUM_MODEL:-scribe_v2}
      STUDIO_ELEVENLABS_REALTIME_MODEL: ${STUDIO_ELEVENLABS_REALTIME_MODEL:-scribe_v2_realtime}
      STUDIO_YANDEX_ECONOMIC_MODEL: ${STUDIO_YANDEX_ECONOMIC_MODEL:-deferred-general}
      STUDIO_YANDEX_STANDARD_MODEL: ${STUDIO_YANDEX_STANDARD_MODEL:-general}
      STUDIO_YANDEX_PREMIUM_MODEL: ${STUDIO_YANDEX_PREMIUM_MODEL:-general}
      STUDIO_YANDEX_REALTIME_MODEL: ${STUDIO_YANDEX_REALTIME_MODEL:-general}
      STUDIO_YANDEX_STT_API_BASE_URL: ${STUDIO_YANDEX_STT_API_BASE_URL:-https://stt.api.cloud.yandex.net}
      STUDIO_YANDEX_OPERATIONS_API_BASE_URL: ${STUDIO_YANDEX_OPERATIONS_API_BASE_URL:-https://operation.api.cloud.yandex.net}
      STUDIO_YANDEX_STT_GRPC_ENDPOINT: ${STUDIO_YANDEX_STT_GRPC_ENDPOINT:-stt.api.cloud.yandex.net:443}
      STUDIO_YANDEX_OPERATION_POLL_INTERVAL_SECONDS: ${STUDIO_YANDEX_OPERATION_POLL_INTERVAL_SECONDS:-5}
      STUDIO_YANDEX_OPERATION_TIMEOUT_SECONDS: ${STUDIO_YANDEX_OPERATION_TIMEOUT_SECONDS:-14400}
      STUDIO_STT_HEALTH_FAILURE_THRESHOLD: ${STUDIO_STT_HEALTH_FAILURE_THRESHOLD:-3}
      STUDIO_STT_HEALTH_COOLDOWN_SECONDS: ${STUDIO_STT_HEALTH_COOLDOWN_SECONDS:-300}
      STUDIO_SOURCE_MULTIPART_THRESHOLD_BYTES: ${STUDIO_SOURCE_MULTIPART_THRESHOLD_BYTES:-16777216}
      STUDIO_SOURCE_MULTIPART_PART_SIZE_BYTES: ${STUDIO_SOURCE_MULTIPART_PART_SIZE_BYTES:-8388608}
      STUDIO_AUDIO_PREPARATION_MAX_INPUT_BYTES: ${STUDIO_AUDIO_PREPARATION_MAX_INPUT_BYTES:-1073741824}
      STUDIO_AUDIO_PREPARATION_MAX_SCRATCH_BYTES: ${STUDIO_AUDIO_PREPARATION_MAX_SCRATCH_BYTES:-3221225472}
      STUDIO_REALTIME_DRAFT_MAX_COUNT: ${STUDIO_REALTIME_DRAFT_MAX_COUNT:-20}
      STUDIO_REALTIME_DRAFT_MAX_STORAGE_BYTES: ${STUDIO_REALTIME_DRAFT_MAX_STORAGE_BYTES:-33554432}
      STUDIO_AUDIO_PREPARATION_MAX_OUTPUT_BYTES: ${STUDIO_AUDIO_PREPARATION_MAX_OUTPUT_BYTES:-2147483647}
      STUDIO_AUDIO_DELIVERY_DIRECTORY: /run/studio-audio-delivery
      STUDIO_GOOGLE_OAUTH_CLIENT_ID: ${STUDIO_GOOGLE_OAUTH_CLIENT_ID:-}
      STUDIO_GOOGLE_OAUTH_CLIENT_SECRET_FILE: /run/studio-runtime-secrets/studio_google_oauth_client_secret
      STUDIO_GOOGLE_OAUTH_REDIRECT_URI: ${STUDIO_GOOGLE_OAUTH_REDIRECT_URI:-}
      STUDIO_GOOGLE_OAUTH_SCOPES: ${STUDIO_GOOGLE_OAUTH_SCOPES:-openid email https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly}
